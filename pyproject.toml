[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent"
version = "0.1.0"
description = "Hệ thống đa tác nhân: máy chủ điều phối máy con thu thập tin tức và ra quyết định tài chính"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LƯU Ý: khung đa tác nhân TradingAgents KHÔNG khai báo ở đây.
    #
    # Trên PyPI có gói tên "tradingagents" nhưng ở phiên bản khác (0.7.x) so với
    # bản đã kiểm thử và vá trong đồ án này (0.5.1). Cài từ PyPI sẽ lấy sai phiên
    # bản và làm hỏng các bản vá trong finagent/decision/vendor.py.
    #
    # Bản đã kiểm thử nằm tại vendor/TradingAgents và được cài riêng:
    #     pip install -e vendor/TradingAgents
    # Các script trong deploy/ đã làm sẵn bước này.
    #
    # Lớp phân tán máy chủ ↔ máy con
    "celery[redis]>=5.4",
    "redis>=5.0",
    # Giao tiếp người dùng
    "python-telegram-bot>=21.0",
    # Thu thập dữ liệu
    "requests>=2.32",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "pandas>=2.3.0",
    # Hạ tầng
    "python-dotenv>=1.0",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
finagent = "finagent.cli:main"

[tool.setuptools.packages.find]
include = ["finagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]
